# ── Configuración Básica ──
spring.application.name=hydra.security
server.port=8081

# ── Seguridad y Criptografía ──
app.crypto.password=${APP_CRYPTO_PASSWORD:}
app.crypto.salt=${APP_CRYPTO_SALT:}

# ── JWT (Configurado con variable de entorno) ──
jwt.secret=${JWT_SECRET}

# ── Multipart File Upload ──
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── Base de Datos PostgreSQL ──
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Sin base de datos ──
# Este servicio no usa JPA ni datasource (0 repositorios/entidades); solo
# crypto, JWT y S3. Excluimos la autoconfiguracion para que no intente abrir
# una conexion (y no dependa de SPRING_DATASOURCE_*).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# ── Supabase Storage S3 ──
supabase.s3.endpoint=https://mpmmdqnwsnjuzbsyigvq.storage.supabase.co/storage/v1/s3
supabase.s3.region=us-west-2
supabase.s3.access-key=${SUPABASE_S3_ACCESS_KEY}
supabase.s3.secret-key=${SUPABASE_S3_SECRET_KEY}
supabase.bucket=Pacientes
# Bucket para adjuntos de mensajeria (conversaciones 1:1)
supabase.bucket.mensajes=${SUPABASE_BUCKET_MENSAJES:Mensajes}
# Minutos de validez de las URLs firmadas (presigned) de descarga
supabase.s3.presign-minutes=${SUPABASE_S3_PRESIGN_MINUTES:60}
# URL publica de este servicio; se usa para construir enlaces estables a los adjuntos
app.public-base-url=${APP_PUBLIC_BASE_URL:https://hydra-arm-security.onrender.com}
